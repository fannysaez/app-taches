<!DOCTYPE html>
<html>
<head>
    <title>Test Edit Functionality</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .task-card { border: 1px solid #ddd; padding: 15px; margin: 10px 0; border-radius: 8px; }
        .task-actions { margin-top: 10px; }
        .action-button { padding: 5px 10px; margin-right: 5px; border: none; border-radius: 4px; cursor: pointer; }
        .edit-button { background: #e0f2fe; color: #0c4a6e; }
        .save-button { background: #dcfce7; color: #166534; }
        .cancel-button { background: #fee2e2; color: #991b1b; }
        .delete-button { background: #fee2e2; color: #991b1b; }
        .edit-form { display: flex; flex-direction: column; gap: 10px; }
        .edit-input, .edit-textarea { padding: 8px; border: 2px solid #3b82f6; border-radius: 4px; }
        .edit-textarea { height: 60px; resize: vertical; }
        .edit-actions { display: flex; gap: 8px; margin-top: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 Test Edit Functionality</h1>
        
        <!-- Test task in normal mode -->
        <div class="task-card" id="task-1">
            <div class="task-content">
                <h3>⏳ Tâche de test</h3>
                <p>Ceci est une description de test</p>
                <p style="color: #999; font-size: 12px;">Créée le 02/07/2025</p>
            </div>
            <div class="task-actions">
                <button class="action-button edit-button" onclick="startEdit(1)">✏️ Modifier</button>
                <button class="action-button delete-button">🗑️ Supprimer</button>
            </div>
        </div>
    </div>

    <script>
        let editingTaskId = null;
        let editingTask = { title: '', description: '' };

        function startEdit(taskId) {
            editingTaskId = taskId;
            editingTask = {
                title: 'Tâche de test',
                description: 'Ceci est une description de test'
            };
            
            const taskCard = document.getElementById(`task-${taskId}`);
            taskCard.innerHTML = `
                <div class="edit-form">
                    <input type="text" 
                           class="edit-input" 
                           value="${editingTask.title}" 
                           placeholder="Titre de la tâche..."
                           id="edit-title" />
                    
                    <textarea class="edit-textarea" 
                              placeholder="Description (optionnelle)..."
                              id="edit-description">${editingTask.description}</textarea>
                    
                    <div class="edit-actions">
                        <button class="action-button save-button" onclick="saveEdit(${taskId})">💾 Sauvegarder</button>
                        <button class="action-button cancel-button" onclick="cancelEdit(${taskId})">❌ Annuler</button>
                    </div>
                </div>
            `;
        }

        function saveEdit(taskId) {
            const title = document.getElementById('edit-title').value;
            const description = document.getElementById('edit-description').value;
            
            // Simulate save
            console.log('Saving:', { title, description });
            alert(`Tâche sauvegardée:\nTitre: ${title}\nDescription: ${description}`);
            
            // Return to normal view with updated content
            const taskCard = document.getElementById(`task-${taskId}`);
            taskCard.innerHTML = `
                <div class="task-content">
                    <h3>⏳ ${title}</h3>
                    <p>${description}</p>
                    <p style="color: #999; font-size: 12px;">Créée le 02/07/2025</p>
                </div>
                <div class="task-actions">
                    <button class="action-button edit-button" onclick="startEdit(${taskId})">✏️ Modifier</button>
                    <button class="action-button delete-button">🗑️ Supprimer</button>
                </div>
            `;
            
            editingTaskId = null;
        }

        function cancelEdit(taskId) {
            // Return to normal view
            const taskCard = document.getElementById(`task-${taskId}`);
            taskCard.innerHTML = `
                <div class="task-content">
                    <h3>⏳ Tâche de test</h3>
                    <p>Ceci est une description de test</p>
                    <p style="color: #999; font-size: 12px;">Créée le 02/07/2025</p>
                </div>
                <div class="task-actions">
                    <button class="action-button edit-button" onclick="startEdit(${taskId})">✏️ Modifier</button>
                    <button class="action-button delete-button">🗑️ Supprimer</button>
                </div>
            `;
            
            editingTaskId = null;
        }
    </script>
</body>
</html>
